<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MORPHEUS PATH — Вхід</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    body { min-height: 100vh; background: #f0f1f2; display: flex; align-items: center; justify-content: center; padding: 24px; }

    .card { background: #fff; border-radius: 16px; padding: 48px 44px; width: 100%; max-width: 460px; box-shadow: 0 4px 24px rgba(0,0,0,.06); }

    .card-header { text-align: center; margin-bottom: 32px; }
    .card-title { font-size: 22px; font-weight: 700; color: #0f172a; line-height: 1.3; margin-bottom: 8px; }
    .card-sub { font-size: 14px; color: #64748b; }

    .field { margin-bottom: 18px; }
    .field-label { display: block; font-size: 14px; font-weight: 500; color: #0f172a; margin-bottom: 8px; }
    .field-input { width: 100%; padding: 11px 14px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; color: #0f172a; background: #f8fafc; outline: none; transition: border-color .15s, box-shadow .15s, background .15s; }
    .field-input::placeholder { color: #94a3b8; }
    .field-input:focus { border-color: #6366f1; background: #fff; box-shadow: 0 0 0 3px rgba(99,102,241,.1); }

    .error-box { background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #ef4444; margin-bottom: 16px; display: none; }
    .error-box.show { display: block; }

    .btn-login { width: 100%; padding: 13px; background: #0f172a; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; margin-top: 8px; transition: background .15s; display: flex; align-items: center; justify-content: center; }
    .btn-login:hover:not(:disabled) { background: #1e293b; }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }
    .btn-login.loading .btn-text { display: none; }
    .btn-login.loading::after { content: ''; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: white; border-radius: 50%; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .demo-title { font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 8px; }
    .demo-row { font-size: 12px; color: #475569; line-height: 1.8; }
    .demo-row strong { color: #0f172a; }
    .demo-row code { font-family: 'JetBrains Mono', monospace; color: #6366f1; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1 class="card-title">MORPHEUS PATHOLOGY</h1>
      <p class="card-sub">Увійдіть для доступу до системи</p>
    </div>

    <div id="error-box" class="error-box"></div>

    <div class="field">
      <label class="field-label" for="email">Email</label>
      <input class="field-input" type="email" id="email" placeholder="Введіть ваш email" autocomplete="email">
    </div>

    <div class="field">
      <label class="field-label" for="password">Пароль</label>
      <input class="field-input" type="password" id="password" placeholder="Введіть ваш пароль" autocomplete="current-password">
    </div>

    <button class="btn-login" id="btn-login">
      <span class="btn-text">Увійти</span>
    </button>

    
  </div>

  <script type="module">
    import { login, getSession, getProfile, redirectByRole } from '/MORPHEUS-PATH/js/auth.js';

    (async () => {
      const session = await getSession();
      if (session) {
        const profile = await getProfile();
        if (profile) redirectByRole(profile.role);
      }
    })();

    const emailEl  = document.getElementById('email');
    const passEl   = document.getElementById('password');
    const btnEl    = document.getElementById('btn-login');
    const errorBox = document.getElementById('error-box');

    function showError(msg) { errorBox.textContent = msg; errorBox.classList.add('show'); }
    function hideError()    { errorBox.classList.remove('show'); }
    function setLoading(v)  { btnEl.disabled = v; btnEl.classList.toggle('loading', v); }

    async function handleLogin() {
      hideError();
      const email    = emailEl.value.trim();
      const password = passEl.value;
      if (!email || !password) { showError('Введіть email та пароль'); return; }
      setLoading(true);
      try {
        await login(email, password);
        const profile = await getProfile();
        redirectByRole(profile.role);
      } catch {
        showError('Невірний email або пароль');
        setLoading(false);
      }
    }

    btnEl.addEventListener('click', handleLogin);
    passEl.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
  </script>
</body>
</html>
