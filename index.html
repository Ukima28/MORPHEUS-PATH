<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MORPHEUS PATH — Вхід</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --sidebar-bg: #272c35;
      --accent: #3b82f6;
      --border: #e2e8f0;
      --bg: #f1f5f9;
      --text: #1e293b;
      --text-2: #64748b;
      --red: #ef4444;
    }
    html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); -webkit-font-smoothing: antialiased; }
    body { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }

    .left {
      background: var(--sidebar-bg);
      padding: 36px 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .left::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 20% 60%, rgba(59,130,246,.12) 0%, transparent 65%);
      pointer-events: none;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .logo-box {
      width: 38px;
      height: 38px;
      border: 2px solid rgba(255,255,255,.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 18px;
      color: white;
      flex-shrink: 0;
    }

    .brand { font-size: 13px; font-weight: 700; letter-spacing: .14em; color: white; text-transform: uppercase; }
    .brand-sub { font-size: 9px; color: rgba(255,255,255,.28); letter-spacing: .08em; margin-top: 2px; }

    .hero {
      position: relative;
      z-index: 1;
    }

    .hero-title {
      font-size: 30px;
      font-weight: 300;
      color: white;
      line-height: 1.35;
      letter-spacing: -.01em;
    }

    .hero-title strong { font-weight: 700; display: block; }

    .left-footer { font-size: 10px; color: rgba(255,255,255,.18); position: relative; z-index: 1; }

    .right {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background: white;
    }

    .login-card { width: 100%; max-width: 360px; }

    .login-heading { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .login-sub { font-size: 12px; color: var(--text-2); margin-bottom: 28px; }

    .field { margin-bottom: 16px; }

    .label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--border);
      background: #f8fafc;
      border-radius: 2px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus {
      border-color: var(--accent);
      background: white;
      box-shadow: 0 0 0 3px rgba(59,130,246,.1);
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: var(--sidebar-bg);
      color: white;
      border: none;
      border-radius: 2px;
      font-size: 11px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      text-transform: uppercase;
      letter-spacing: .08em;
      cursor: pointer;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .15s;
    }

    .btn-login:hover:not(:disabled) { background: #323944; }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }

    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 2px;
      padding: 10px 13px;
      font-size: 12px;
      color: var(--red);
      margin-bottom: 16px;
      display: none;
    }
    .error-box.show { display: block; }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: none;
    }

    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 720px) {
      body { grid-template-columns: 1fr; }
      .left { display: none; }
    }
  </style>
</head>
<body>

<div class="left">
  <div class="logo-row">
    <div class="logo-box">M</div>
    <div>
      <div class="brand">Morpheus Path</div>
      <div class="brand-sub">Pathomorphology Information System</div>
    </div>
  </div>

  <div class="hero">
    <h1 class="hero-title">
      Pathomorphology<br>
      Information<br>
      <strong>System</strong>
    </h1>
  </div>

  <div class="left-footer">© 2025 Morpheus Path</div>
</div>

<div class="right">
  <div class="login-card">
    <h2 class="login-heading">Авторизація</h2>
    <p class="login-sub">Введіть облікові дані для входу</p>

    <div id="error-box" class="error-box"></div>

    <div class="field">
      <label class="label" for="email">Ідентифікатор</label>
      <input type="email" id="email" placeholder="email@lab.ua" autocomplete="email">
    </div>

    <div class="field">
      <label class="label" for="password">Ключ доступу</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn-login" id="btn-login">
      <span class="btn-text">Увійти</span>
      <div class="spinner"></div>
    </button>
  </div>
</div>

<script type="module">
  import { login, getSession, getProfile, redirectByRole } from '/MORPHEUS-PATH/js/auth.js';

  (async () => {
    const session = await getSession();
    if (session) {
      const profile = await getProfile();
      if (profile) redirectByRole(profile.role);
    }
  })();

  const emailEl    = document.getElementById('email');
  const passwordEl = document.getElementById('password');
  const btnLogin   = document.getElementById('btn-login');
  const errorBox   = document.getElementById('error-box');

  function showError(msg) { errorBox.textContent = msg; errorBox.classList.add('show'); }
  function hideError()    { errorBox.classList.remove('show'); }
  function setLoading(v)  { btnLogin.disabled = v; btnLogin.classList.toggle('loading', v); }

  async function handleLogin() {
    hideError();
    const email    = emailEl.value.trim();
    const password = passwordEl.value;
    if (!email || !password) { showError('Введіть ідентифікатор та ключ доступу'); return; }
    setLoading(true);
    try {
      await login(email, password);
      const profile = await getProfile();
      redirectByRole(profile.role);
    } catch {
      showError('Невірний ідентифікатор або ключ доступу');
      setLoading(false);
    }
  }

  btnLogin.addEventListener('click', handleLogin);
  passwordEl.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
</script>
</body>
</html>
