<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>MORPHEUS PATH — Вхід</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="/MORPHEUS-PATH/css/sb-admin-2.min.css" rel="stylesheet">
  <link href="/MORPHEUS-PATH/css/morpheus.css" rel="stylesheet">
  <style>
    body { background: #eef2ff !important; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { width: 100%; max-width: 420px; }
    .login-card .card { border: none; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08) !important; }
    .login-card .card-body { padding: 40px !important; }
    .login-title { font-size: 20px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
    .login-sub { font-size: 13px; color: #64748b; margin-bottom: 28px; }
    .login-label { font-size: 13px; font-weight: 500; color: #0f172a; margin-bottom: 6px; display: block; }
    .login-input { width: 100%; padding: 10px 14px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; color: #0f172a; background: #f8fafc; outline: none; transition: border-color .15s, box-shadow .15s; margin-bottom: 16px; }
    .login-input:focus { border-color: #3b82f6; background: #fff; box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
    .login-btn { width: 100%; padding: 12px; background: #0f172a; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; transition: background .15s; margin-top: 4px; }
    .login-btn:hover:not(:disabled) { background: #1e293b; }
    .login-btn:disabled { opacity: .6; cursor: not-allowed; }
    .login-btn.loading::after { content: ''; display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-top-color: white; border-radius: 50%; animation: spin .6s linear infinite; margin-left: 8px; vertical-align: middle; }
    .login-btn.loading .btn-text { opacity: 0.6; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box { background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #ef4444; margin-bottom: 16px; display: none; }
    .error-box.show { display: block; }
    .demo-box { margin-top: 20px; padding: 14px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; }
    .demo-title { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
    .demo-row { font-size: 12px; color: #475569; line-height: 1.9; }
    .demo-row strong { color: #0f172a; }
    .demo-code { font-family: 'JetBrains Mono', monospace; color: #3b82f6; font-size: 11px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="card">
      <div class="card-body">
        <div class="text-center mb-4">
          <h1 class="login-title">MORPHEUS PATHOLOGY</h1>
          <p class="login-sub">Увійдіть для доступу до системи</p>
        </div>

        <div id="error-box" class="error-box"></div>

        <div>
          <label class="login-label" for="email">Email</label>
          <input class="login-input" type="email" id="email" placeholder="Введіть ваш email" autocomplete="email">
        </div>

        <div>
          <label class="login-label" for="password">Пароль</label>
          <input class="login-input" type="password" id="password" placeholder="Введіть ваш пароль" autocomplete="current-password">
        </div>

        <button class="login-btn" id="btn-login">
          <span class="btn-text">Увійти</span>
        </button>

        <div class="demo-box">
          <div class="demo-title">Demo облікові дані</div>
          <div class="demo-row"><strong>Адмін:</strong> <span class="demo-code">admin@morpheuspath.ua</span> / Admin1234!</div>
          <div class="demo-row"><strong>Патолог:</strong> <span class="demo-code">pathologist@morpheuspath.ua</span> / Path1234!</div>
          <div class="demo-row"><strong>Лаборант:</strong> <span class="demo-code">laborant@morpheuspath.ua</span> / Lab1234!</div>
          <div class="demo-row"><strong>Реєстратор:</strong> <span class="demo-code">registrar@morpheuspath.ua</span> / Reg1234!</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { login, getSession, getProfile, redirectByRole } from '/MORPHEUS-PATH/js/auth.js';

    (async () => {
      const session = await getSession();
      if (session) {
        const profile = await getProfile();
        if (profile) redirectByRole(profile.role);
      }
    })();

    const emailEl  = document.getElementById('email');
    const passEl   = document.getElementById('password');
    const btnEl    = document.getElementById('btn-login');
    const errorBox = document.getElementById('error-box');

    function showError(msg) { errorBox.textContent = msg; errorBox.classList.add('show'); }
    function hideError()    { errorBox.classList.remove('show'); }
    function setLoading(v)  { btnEl.disabled = v; btnEl.classList.toggle('loading', v); }

    async function handleLogin() {
      hideError();
      const email    = emailEl.value.trim();
      const password = passEl.value;
      if (!email || !password) { showError('Введіть email та пароль'); return; }
      setLoading(true);
      try {
        await login(email, password);
        const profile = await getProfile();
        redirectByRole(profile.role);
      } catch {
        showError('Невірний email або пароль');
        setLoading(false);
      }
    }

    btnEl.addEventListener('click', handleLogin);
    passEl.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
  </script>
</body>
</html>
