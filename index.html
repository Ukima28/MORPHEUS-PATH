<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MORPHEUS PATH — Вхід</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/morpheos-path/css/morpheus.css">
  <style>body { font-family: 'Inter', sans-serif; }</style>
  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
</head>
<body class="d-flex flex-column" style="background-color:#e8ecf0!important">
<script>document.addEventListener("DOMContentLoaded",()=>{document.body.style.opacity="1";});</script>
<div class="page page-center">
  <div class="container container-tight py-4">

    <div class="mb-4 text-center">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 292 145" width="260" role="img">
        <title>MORPHEOS PATHOLOGY</title>
        <text font-family="Arial,sans-serif" font-size="54" font-weight="300" letter-spacing="4" textLength="292" lengthAdjust="spacing">
          <tspan x="0" y="72" fill="#1a1a1a">MORPHE</tspan><tspan fill="#BA1A32">OS</tspan>
        </text>
        <text x="0" y="126" font-family="Arial,sans-serif" font-size="54" font-weight="300" letter-spacing="4" fill="#1a1a1a" textLength="292" lengthAdjust="spacing">PATHOLOGY</text>
        <rect x="0" y="140" width="292" height="2" fill="#BA1A32" opacity="0.5"/>
      </svg>
    </div>

    <div class="card card-md">
      <div class="card-body">

        <div id="error-alert" class="alert alert-danger d-none mb-3" role="alert"></div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-control" placeholder="Введіть ваш email" autocomplete="email">
        </div>

        <div class="mb-3">
          <label class="form-label">Пароль</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password">
        </div>

        <div class="form-footer">
          <button type="button" id="btn-login" class="btn btn-primary w-100">
            <span class="btn-text">Увійти</span>
            <span class="spinner-border spinner-border-sm d-none ms-2" id="spinner"></span>
          </button>
        </div>

      </div>
    </div>

  </div>
</div>

<script type="module">
  import { login, getSession, getProfile, redirectByRole } from '/morpheos-path/js/auth.js';

  (async () => {
    const session = await getSession();
    if (session) {
      const profile = await getProfile();
      if (profile) redirectByRole(profile.role);
    }
  })();

  const emailEl = document.getElementById('email');
  const passEl  = document.getElementById('password');
  const btnEl   = document.getElementById('btn-login');
  const spinner = document.getElementById('spinner');
  const errEl   = document.getElementById('error-alert');

  function showError(msg) { errEl.textContent = msg; errEl.classList.remove('d-none'); }
  function hideError()    { errEl.classList.add('d-none'); }
  function setLoading(v)  { btnEl.disabled = v; spinner.classList.toggle('d-none', !v); }

  async function handleLogin() {
    hideError();
    const email    = emailEl.value.trim();
    const password = passEl.value;
    if (!email || !password) { showError('Введіть email та пароль'); return; }
    setLoading(true);
    try {
      await login(email, password);
      const profile = await getProfile();
      redirectByRole(profile.role);
    } catch {
      showError('Невірний email або пароль');
      setLoading(false);
    }
  }

  btnEl.addEventListener('click', handleLogin);
  passEl.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
</script>
</body>
</html>
