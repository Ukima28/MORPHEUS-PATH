<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MORPHEUS PATH — Вхід</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .demo-box { background: var(--tblr-bg-surface-secondary); border-radius: var(--tblr-border-radius); padding: 1rem; margin-top: 1.5rem; font-size: 13px; }
    .demo-code { font-family: 'JetBrains Mono', monospace; color: var(--tblr-primary); font-size: 12px; }
  </style>
</head>
<body class="d-flex flex-column">
<div class="page page-center">
  <div class="container container-tight py-4">

    <div class="text-center mb-4">
      <h1 class="fw-bold mb-1" style="font-size:20px;letter-spacing:.04em">MORPHEUS PATHOLOGY</h1>
      <p class="text-muted">Увійдіть для доступу до системи</p>
    </div>

    <div class="card card-md">
      <div class="card-body">

        <div id="error-alert" class="alert alert-danger d-none" role="alert"></div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-control" placeholder="Введіть ваш email" autocomplete="email">
        </div>

        <div class="mb-3">
          <label class="form-label">Пароль</label>
          <input type="password" id="password" class="form-control" placeholder="Введіть ваш пароль" autocomplete="current-password">
        </div>

        <div class="form-footer">
          <button type="button" id="btn-login" class="btn btn-primary w-100">
            <span class="btn-text">Увійти</span>
            <span class="spinner-border spinner-border-sm d-none ms-2" id="spinner"></span>
          </button>
        </div>

      </div>
    </div>

    <div class="demo-box">
      <div class="fw-semibold mb-2 text-muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.06em">Demo облікові дані</div>
      <div><strong>Адмін:</strong> <span class="demo-code">admin@morpheuspath.ua</span> / Admin1234!</div>
      <div><strong>Патолог:</strong> <span class="demo-code">pathologist@morpheuspath.ua</span> / Path1234!</div>
      <div><strong>Лаборант:</strong> <span class="demo-code">laborant@morpheuspath.ua</span> / Lab1234!</div>
      <div><strong>Реєстратор:</strong> <span class="demo-code">registrar@morpheuspath.ua</span> / Reg1234!</div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
<script type="module">
  import { login, getSession, getProfile, redirectByRole } from '/MORPHEUS-PATH/js/auth.js';

  (async () => {
    const session = await getSession();
    if (session) {
      const profile = await getProfile();
      if (profile) redirectByRole(profile.role);
    }
  })();

  const emailEl  = document.getElementById('email');
  const passEl   = document.getElementById('password');
  const btnEl    = document.getElementById('btn-login');
  const spinner  = document.getElementById('spinner');
  const errorEl  = document.getElementById('error-alert');

  function showError(msg) { errorEl.textContent = msg; errorEl.classList.remove('d-none'); }
  function hideError()    { errorEl.classList.add('d-none'); }
  function setLoading(v)  {
    btnEl.disabled = v;
    spinner.classList.toggle('d-none', !v);
  }

  async function handleLogin() {
    hideError();
    const email    = emailEl.value.trim();
    const password = passEl.value;
    if (!email || !password) { showError('Введіть email та пароль'); return; }
    setLoading(true);
    try {
      await login(email, password);
      const profile = await getProfile();
      redirectByRole(profile.role);
    } catch {
      showError('Невірний email або пароль');
      setLoading(false);
    }
  }

  btnEl.addEventListener('click', handleLogin);
  passEl.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
</script>
</body>
</html>
