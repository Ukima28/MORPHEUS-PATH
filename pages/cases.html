<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morpheus Path — Журнал</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/MORPHEUS-PATH/css/main.css">
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar рендериться через JS -->
    <div class="main-content">
      <div class="topbar">
        <span class="topbar-title">Журнал заключень</span>
        <button class="btn btn-primary" id="btn-new-case">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Нове заключення
        </button>
      </div>

      <div class="page-content">

        <!-- Статистика -->
        <div class="stats-row" id="stats-row">
          <div class="stat-card">
            <div class="stat-icon blue">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
            </div>
            <div>
              <div class="stat-value" id="stat-total">—</div>
              <div class="stat-label">Всього</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon amber">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
            </div>
            <div>
              <div class="stat-value" id="stat-inprogress">—</div>
              <div class="stat-label">В роботі</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon green">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 6L9 17l-5-5"/></svg>
            </div>
            <div>
              <div class="stat-value" id="stat-signed">—</div>
              <div class="stat-label">Підписано</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon purple">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </div>
            <div>
              <div class="stat-value" id="stat-today">—</div>
              <div class="stat-label">За сьогодні</div>
            </div>
          </div>
        </div>

        <!-- Таблиця -->
        <div class="table-wrap">
          <div class="table-toolbar">
            <!-- Пошук -->
            <div class="search-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <input class="search-input" type="text" id="search-input" placeholder="Пошук по номеру або пацієнту...">
            </div>

            <!-- Фільтр статусу -->
            <select class="form-select" id="filter-status" style="width:160px">
              <option value="">Всі статуси</option>
              <option value="draft">Чернетка</option>
              <option value="in_progress">В роботі</option>
              <option value="signed">Підписано</option>
              <option value="archived">Архів</option>
            </select>

            <!-- Фільтр матеріалу -->
            <select class="form-select" id="filter-material" style="width:160px">
              <option value="">Всі типи</option>
              <option value="biopsy">Біопсія</option>
              <option value="surgical">Операційний</option>
              <option value="cytology">Цитологія</option>
              <option value="other">Інше</option>
            </select>

            <!-- Кнопка видалення вибраних -->
            <button class="btn btn-danger hidden" id="btn-delete-selected">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3,6 5,6 21,6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
              Видалити (<span id="selected-count">0</span>)
            </button>
          </div>

          <div id="table-loading" style="padding:40px;text-align:center;color:#9CA3AF;font-size:13px">
            Завантаження...
          </div>

          <table id="cases-table" class="hidden">
            <thead>
              <tr>
                <th style="width:40px"><input type="checkbox" id="check-all"></th>
                <th>Номер</th>
                <th>Дата</th>
                <th>Пацієнт</th>
                <th>Тип матеріалу</th>
                <th>Статус</th>
                <th>Патолог</th>
              </tr>
            </thead>
            <tbody id="cases-tbody"></tbody>
          </table>

          <div id="table-empty" class="hidden" style="padding:48px;text-align:center;color:#9CA3AF;font-size:13px">
            Заключень не знайдено
          </div>

          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Модальне вікно: Нове заключення -->
  <div class="modal-overlay" id="modal-new-case">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Нове заключення</span>
        <button class="modal-close" id="modal-close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="modal-error" class="error-msg" style="background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:10px 14px;font-size:13px;color:#EF4444;margin-bottom:16px;display:none"></div>
        <div class="form-group">
          <label class="form-label">Номер заключення <span class="req">*</span></label>
          <input class="form-input" type="text" id="new-case-number" placeholder="напр. 0001-25">
        </div>
        <div class="form-group">
          <label class="form-label">Дата</label>
          <input class="form-input" type="date" id="new-case-date">
        </div>
        <div class="form-group">
          <label class="form-label">ПІБ пацієнта</label>
          <input class="form-input" type="text" id="new-patient-name" placeholder="Прізвище Ім'я По-батькові">
        </div>
        <div class="form-group">
          <label class="form-label">Дата народження</label>
          <input class="form-input" type="date" id="new-patient-dob">
        </div>
        <div class="form-group">
          <label class="form-label">Тип матеріалу <span class="req">*</span></label>
          <select class="form-select" id="new-material-type">
            <option value="biopsy">Біопсія</option>
            <option value="surgical">Операційний</option>
            <option value="cytology">Цитологія</option>
            <option value="other">Інше</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Клінічна інформація</label>
          <textarea class="form-textarea" id="new-clinical-info" rows="3" style="min-height:70px"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btn-modal-cancel">Скасувати</button>
        <button class="btn btn-primary" id="btn-modal-save">Створити</button>
      </div>
    </div>
  </div>

  <style>
    .error-msg { display: none; }
    .error-msg.show { display: block !important; }
  </style>

  <script type="module">
    import { requireAuth, getProfile } from '/MORPHEUS-PATH/js/auth.js';
    import { renderShell, toast } from '/MORPHEUS-PATH/js/shell.js';
    import { supabase } from '/MORPHEUS-PATH/js/supabase.js';

    const MATERIAL_LABELS = { biopsy: 'Біопсія', surgical: 'Операційний', cytology: 'Цитологія', other: 'Інше' };
    const STATUS_LABELS   = { draft: 'Чернетка', in_progress: 'В роботі', signed: 'Підписано', archived: 'Архів' };

    let profile = null;
    let allCases = [];
    let selectedIds = new Set();
    let searchTimer = null;

    const PAGE_SIZE = 20;
    let currentPage = 1;
    let filteredCases = [];

    // Ініціалізація
    async function init() {
      await requireAuth();
      profile = await renderShell('cases');
      if (!profile) return;

      // Встановлюємо сьогоднішню дату у формі
      document.getElementById('new-case-date').value = new Date().toISOString().split('T')[0];

      await loadCases();
      bindEvents();
    }

    // Завантаження заключень
    async function loadCases() {
      document.getElementById('table-loading').classList.remove('hidden');
      document.getElementById('cases-table').classList.add('hidden');
      document.getElementById('table-empty').classList.add('hidden');

      let query = supabase
        .from('cases')
        .select(`
          id, case_number, case_date, patient_name, material_type, status, created_at,
          profiles!cases_assigned_pathologist_fkey(full_name)
        `)
        .order('created_at', { ascending: false });

      const { data, error } = await query;

      document.getElementById('table-loading').classList.add('hidden');

      if (error) {
        toast('Помилка завантаження даних', 'error');
        return;
      }

      allCases = data || [];
      updateStats();
      applyFilters();
    }

    // Статистика
    function updateStats() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('stat-total').textContent      = allCases.length;
      document.getElementById('stat-inprogress').textContent = allCases.filter(c => c.status === 'in_progress').length;
      document.getElementById('stat-signed').textContent     = allCases.filter(c => c.status === 'signed').length;
      document.getElementById('stat-today').textContent      = allCases.filter(c => c.case_date === today).length;
    }

    // Фільтрація
    function applyFilters() {
      const search   = document.getElementById('search-input').value.toLowerCase().trim();
      const status   = document.getElementById('filter-status').value;
      const material = document.getElementById('filter-material').value;

      filteredCases = allCases.filter(c => {
        const matchSearch = !search ||
          c.case_number?.toLowerCase().includes(search) ||
          c.patient_name?.toLowerCase().includes(search);
        const matchStatus   = !status   || c.status === status;
        const matchMaterial = !material || c.material_type === material;
        return matchSearch && matchStatus && matchMaterial;
      });

      currentPage = 1;
      renderTable();
    }

    // Рендер таблиці
    function renderTable() {
      const tbody = document.getElementById('cases-tbody');
      const table = document.getElementById('cases-table');
      const empty = document.getElementById('table-empty');

      if (!filteredCases.length) {
        table.classList.add('hidden');
        empty.classList.remove('hidden');
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      table.classList.remove('hidden');
      empty.classList.add('hidden');

      const start = (currentPage - 1) * PAGE_SIZE;
      const page  = filteredCases.slice(start, start + PAGE_SIZE);

      tbody.innerHTML = page.map(c => {
        const pathName = c.profiles?.full_name || '—';
        const checked  = selectedIds.has(c.id) ? 'checked' : '';
        return `
          <tr data-id="${c.id}">
            <td><input type="checkbox" class="row-check" data-id="${c.id}" ${checked}></td>
            <td><span class="text-mono">${c.case_number || '—'}</span></td>
            <td>${formatDate(c.case_date)}</td>
            <td>${c.patient_name || <span style="color:#9CA3AF">—</span>}</td>
            <td>${MATERIAL_LABELS[c.material_type] || c.material_type}</td>
            <td><span class="badge badge-${c.status}">${STATUS_LABELS[c.status] || c.status}</span></td>
            <td style="color:#6B7280">${pathName}</td>
          </tr>
        `;
      }).join('');

      renderPagination();
      bindRowEvents();
    }

    // Пагінація
    function renderPagination() {
      const total = filteredCases.length;
      const pages = Math.ceil(total / PAGE_SIZE);
      const pg = document.getElementById('pagination');

      if (pages <= 1) { pg.innerHTML = `<span class="pagination-info">Показано ${total} записів</span>`; return; }

      const start = (currentPage - 1) * PAGE_SIZE + 1;
      const end   = Math.min(currentPage * PAGE_SIZE, total);

      let btns = '';
      for (let i = 1; i <= pages; i++) {
        btns += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
      }

      pg.innerHTML = `
        <span class="pagination-info">${start}–${end} з ${total}</span>
        ${btns}
      `;

      pg.querySelectorAll('.page-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentPage = parseInt(btn.dataset.page);
          renderTable();
        });
      });
    }

    // Прив'язка подій рядків
    function bindRowEvents() {
      // Клік по рядку — відкрити заключення
      document.querySelectorAll('#cases-tbody tr').forEach(tr => {
        tr.addEventListener('click', e => {
          if (e.target.type === 'checkbox') return;
          window.location.href = `/MORPHEUS-PATH/pages/report.html?id=${tr.dataset.id}`;
        });
      });

      // Чекбокси
      document.querySelectorAll('.row-check').forEach(cb => {
        cb.addEventListener('change', () => {
          if (cb.checked) selectedIds.add(cb.dataset.id);
          else selectedIds.delete(cb.dataset.id);
          updateDeleteBtn();
        });
      });
    }

    // Кнопка видалення
    function updateDeleteBtn() {
      const btn = document.getElementById('btn-delete-selected');
      document.getElementById('selected-count').textContent = selectedIds.size;
      btn.classList.toggle('hidden', selectedIds.size === 0);
    }

    // Видалення вибраних (тільки admin)
    async function deleteSelected() {
      if (!selectedIds.size) return;
      if (!confirm(`Видалити ${selectedIds.size} заключень? Цю дію неможливо скасувати.`)) return;

      const ids = [...selectedIds];
      const { error } = await supabase.from('cases').delete().in('id', ids);

      if (error) { toast('Помилка видалення', 'error'); return; }

      toast(`Видалено ${ids.length} заключень`);
      selectedIds.clear();
      updateDeleteBtn();
      await loadCases();
    }

    // Створення нового заключення
    async function createCase() {
      const caseNumber  = document.getElementById('new-case-number').value.trim();
      const caseDate    = document.getElementById('new-case-date').value;
      const patientName = document.getElementById('new-patient-name').value.trim();
      const patientDob  = document.getElementById('new-patient-dob').value;
      const materialType= document.getElementById('new-material-type').value;
      const clinicalInfo= document.getElementById('new-clinical-info').value.trim();

      const errEl = document.getElementById('modal-error');

      if (!caseNumber) {
        errEl.textContent = 'Введіть номер заключення';
        errEl.style.display = 'block';
        return;
      }

      errEl.style.display = 'none';

      const payload = {
        case_number:     caseNumber,
        case_date:       caseDate || new Date().toISOString().split('T')[0],
        patient_name:    patientName || null,
        patient_dob:     patientDob || null,
        material_type:   materialType,
        clinical_info:   clinicalInfo || null,
        status:          'draft',
        created_by:      profile.id,
        organization_id: profile.organization_id || null,
      };

      const { data, error } = await supabase.from('cases').insert(payload).select().single();

      if (error) {
        errEl.textContent = 'Помилка створення. Перевірте номер заключення.';
        errEl.style.display = 'block';
        return;
      }

      // Створюємо порожній report
      await supabase.from('reports').insert({ case_id: data.id });

      closeModal();
      toast('Заключення створено');
      window.location.href = `/MORPHEUS-PATH/pages/report.html?id=${data.id}`;
    }

    // Модальне вікно
    function openModal()  { document.getElementById('modal-new-case').classList.add('open'); }
    function closeModal() {
      document.getElementById('modal-new-case').classList.remove('open');
      document.getElementById('modal-error').style.display = 'none';
    }

    // Форматування дати
    function formatDate(d) {
      if (!d) return '—';
      const [y, m, day] = d.split('-');
      return `${day}.${m}.${y}`;
    }

    // Прив'язка подій
    function bindEvents() {
      document.getElementById('btn-new-case').addEventListener('click', openModal);
      document.getElementById('modal-close').addEventListener('click', closeModal);
      document.getElementById('btn-modal-cancel').addEventListener('click', closeModal);
      document.getElementById('btn-modal-save').addEventListener('click', createCase);
      document.getElementById('btn-delete-selected').addEventListener('click', deleteSelected);

      // Фільтри
      document.getElementById('filter-status').addEventListener('change', applyFilters);
      document.getElementById('filter-material').addEventListener('change', applyFilters);

      // Пошук з debounce
      document.getElementById('search-input').addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(applyFilters, 300);
      });

      // Check all
      document.getElementById('check-all').addEventListener('change', e => {
        const checked = e.target.checked;
        filteredCases.forEach(c => {
          if (checked) selectedIds.add(c.id);
          else selectedIds.delete(c.id);
        });
        renderTable();
        updateDeleteBtn();
      });

      // Закриття модалки по кліку поза нею
      document.getElementById('modal-new-case').addEventListener('click', e => {
        if (e.target === e.currentTarget) closeModal();
      });

      // Приховуємо кнопку видалення для не-адмінів
      if (profile?.role !== 'admin') {
        document.getElementById('btn-delete-selected').remove();
      }
    }

    init();
  </script>
</body>
</html>
