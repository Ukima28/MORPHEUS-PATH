<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MORPHEOS PATH — Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/morpheos-path/css/morpheus.css">
  <style id="ruby-theme">
    :root {
      --tblr-primary: #BA1A32;
      --tblr-primary-rgb: 186, 26, 50;
      --tblr-primary-lt: #f8e4e7;
      --tblr-primary-lt-rgb: 248, 228, 231;
    }
    .btn-primary { background-color:#BA1A32!important; border-color:#BA1A32!important; }
    .btn-primary:hover,.btn-primary:focus,.btn-primary:active { background-color:#9A152A!important; border-color:#9A152A!important; }
    .btn-outline-primary { color:#BA1A32!important; border-color:#BA1A32!important; }
    .btn-outline-primary:hover { background-color:#BA1A32!important; color:#fff!important; }
    .nav-item.active .nav-link { color:#BA1A32!important; border-bottom-color:#BA1A32!important; }
    .navbar-nav .nav-link:hover { color:#BA1A32!important; }
    .page-item.active .page-link { background-color:#BA1A32!important; border-color:#BA1A32!important; }
    .form-check-input:checked { background-color:#BA1A32!important; border-color:#BA1A32!important; }
    .form-control:focus,.form-select:focus { border-color:#BA1A32!important; box-shadow:0 0 0 .25rem rgba(186,26,50,.15)!important; }
    .badge.bg-primary { background-color:#BA1A32!important; }
    .avatar { background-color:#BA1A32!important; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
  <style>
    body { opacity: 0; transition: opacity .05s ease; }
    body.loaded { opacity: 1; }
  </style>
</head>
<body class="antialiased" data-theme="ruby">
<div id="navbar-placeholder"></div>
<div class="page-wrapper">
  <div class="page-header d-print-none">
    <div class="container-fluid">
      <div class="row g-2 align-items-center">
        <div class="col">
          <h2 class="page-title">Dashboard</h2>
        </div>
      </div>
    </div>
  </div>
  <div class="page-body">
    <div class="container-fluid">
      <div class="card">
        <div class="card-body text-center py-5 text-muted">
          Розділ в розробці
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module">
  import { requireAuth } from '/morpheos-path/js/auth.js';
  import { renderShell } from '/morpheos-path/js/shell.js';
  async function init() {
    await requireAuth();
    await renderShell('dashboard');
    document.body.classList.add('loaded');
  }
  init();
</script>
</body>
</html>
